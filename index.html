<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Futuros - Gestão de Risco</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 4px;
            color: var(--text-color);
        }

        h2:first-of-type {
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .form-group {
            margin-top: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .results {
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .result-item span {
            font-weight: bold;
            color: var(--accent-color);
        }

        .loss-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-radius: 8px;
        }

        .loss-value {
            color: var(--danger-color);
            font-weight: bold;
        }

        .alert-box {
            margin-top: 16px;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.850rem;
            text-align: center;
            display: none; /* Ativar via JS quando necessário */
        }

        /* Ajustes responsivos adicionais para telas muito pequenas */
        @media (max-width: 380px) {
            .container {
                padding: 12px;
            }
            body {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>CALCULADORA DE FUTUROS</h2>
        <h2>Gestão de Risco</h2>

        <div class="form-group">
            <label for="asset">Ativo</label>
            <input type="text" id="asset" list="assets-list" placeholder="Digite a sigla ou escolha">
            <datalist id="assets-list">
                <option value="Bitcoin">
                <option value="ETH">
                <option value="BNB">
                <option value="XRP">
                <option value="Solana">
                <option value="Hyperliquid">
            </datalist>
        </div>

        <!-- Demais inputs de configuração (Capital, Alavancagem, Preço de Entrada, Stop) entrariam aqui -->

        <div class="results">
            <div class="result-item">
                Tamanho da Posição: <span id="pos-size">$0.00</span>
            </div>
            <div class="result-item">
                Margem Exigida: <span id="margin-req">$0.00</span>
            </div>
            
            <div class="loss-box">
                <div>
                    <span>Perda Financeira Fixa:</span><br>
                    <span class="loss-value">-$0.00</span>
                </div>
                <div>
                    <span class="loss-value">-0.00%</span>
                </div>
            </div>
            
            <div class="result-item">
                Preço de Liquidação: <span id="liq-price">$0.00</span>
            </div>
            
            <div class="alert-box" id="alert-liquidation">
                ⚠️ PERIGO: Liquidação antes do Stop! Reduza a alavancagem.
            </div>
        </div>
    </div>

</body>
</html>
