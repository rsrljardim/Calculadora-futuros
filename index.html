<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Futuros - Gestão de Risco</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; display: flex; justify-content: center; }
        .calc-container { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.8); border: 1px solid #333; }
        h2 { text-align: center; margin-top: 0; color: #f3ba2f; font-size: 20px;}
        
        /* Botões Long/Short */
        .trade-type { display: flex; gap: 10px; margin-bottom: 20px; }
        .trade-type input { display: none; }
        .trade-type label { flex: 1; text-align: center; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; border: 1px solid #444; background: #2a2a2a; color: #aaa; transition: 0.3s; font-size: 14px;}
        #long:checked + .btn-long { background: #4ade80; color: #121212; border-color: #4ade80; }
        #short:checked + .btn-short { background: #f87171; color: #121212; border-color: #f87171; }

        .input-group { margin-bottom: 15px; }
        label.grupo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        
        /* Estilo do Toggle Deslizante (Switch) */
        .switch-container { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
        .switch-container input { display: none; }
        .switch-label { font-size: 13px; font-weight: bold; color: #555; transition: 0.3s; }
        .switch-track { position: relative; width: 40px; height: 20px; background: #2a2a2a; border-radius: 10px; border: 1px solid #444; transition: 0.3s; }
        .switch-thumb { position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; background: #aaa; border-radius: 50%; transition: transform 0.3s ease, background 0.3s; }
        
        /* Estados do Toggle */
        .switch-container input:not(:checked) ~ #label-pct { color: #f3ba2f; }
        .switch-container input:not(:checked) ~ .switch-track .switch-thumb { background: #f3ba2f; }
        
        .switch-container input:checked ~ #label-usd { color: #f3ba2f; }
        .switch-container input:checked ~ .switch-track { border-color: #f3ba2f; }
        .switch-container input:checked ~ .switch-track .switch-thumb { transform: translateX(20px); background: #f3ba2f; }

        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; background: #2a2a2a; color: #ffffff; font-weight: 600; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #f3ba2f; }
        
        input::placeholder { font-size: 12px; font-weight: normal; color: #777; }
        
        .busca-container { display: flex; gap: 8px; }
        #btn-atualizar { background: #f3ba2f; color: #121212; border: none; border-radius: 6px; padding: 0 15px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        #btn-atualizar:hover { background: #e0a800; }
        
        input[type="range"] { width: 100%; margin-top: 10px; accent-color: #f3ba2f; }
        .results { margin-top: 25px; padding: 15px; background: #252525; border-radius: 8px; border: 1px solid #333; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .result-item span:last-child { font-weight: 600; color: #4ade80; }
        .danger { color: #f87171 !important; }
        .warning { color: #fbbf24 !important; }
        
        #api-status { font-size: 12px; color: #aaa; margin-top: 5px; display: block; }
        #alerta-liq { color: #f87171; font-size: 13px; margin-top: 10px; text-align: center; display: none; font-weight: 600; background: rgba(248, 113, 113, 0.1); padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="calc-container">
        <h2>CALCULADORA DE FUTUROS</h2>
        <h2>Gestão de Risco</h2>
        <div class="trade-type">
            <input type="radio" id="long" name="tipo" value="long" checked>
            <label for="long" class="btn-long">Comprado (Long)</label>
            
            <input type="radio" id="short" name="tipo" value="short">
            <label for="short" class="btn-short">Vendido (Short)</label>
        </div>
        
        <div class="input-group">
            <label class="grupo-header">Capital Total ($)</label>
            <input type="text" id="capital" value="100.00">
        </div>
        
        <div class="input-group">
            <label class="grupo-header">
                <span>Risco por Trade</span>
                <label class="switch-container">
                    <input type="checkbox" id="risco-tipo-checkbox" onchange="toggleRisco()">
                    <span class="switch-label" id="label-pct">%</span>
                    <div class="switch-track">
                        <div class="switch-thumb"></div>
                    </div>
                    <span class="switch-label" id="label-usd">$</span>
                </label>
            </label>
            <input type="text" id="risco" value="1.00">
        </div>
        
        <div class="input-group">
            <label class="grupo-header">Criptomoeda (Busca ao vivo Binance)</label>
            <div class="busca-container">
                <input type="text" id="cripto-busca" list="lista-criptos" placeholder="Ex: BTC, ETH, SOL...">
                <button id="btn-atualizar" onclick="buscarPreco()">Cotar</button>
            </div>
            <span id="api-status">Digite a sigla ou escolha na lista.</span>
            
            <datalist id="lista-criptos">
                <option value="BTCUSDT">Bitcoin</option>
                <option value="ETHUSDT">ETH</option>
                <option value="BNBUSDT">BNB</option>
                <option value="XRPUSDT">XRP</option>
                <option value="SOLUSDT">Solana</option>
                <option value="HYPEUSDT">Hyperliquid</option>
            </datalist>
        </div>
        
        <div class="input-group">
            <label class="grupo-header">Preço de Entrada ($)</label>
            <input type="text" id="entrada" value="60,000.00">
        </div>
        
        <div class="input-group">
            <label class="grupo-header">Preço do Stop Loss ($)</label>
            <input type="text" id="stop" value="58,800.00">
        </div>
        
        <div class="input-group">
            <label class="grupo-header"><span>Alavancagem</span> <span style="color:#fff; font-weight:bold"><span id="lev-val">10</span>x</span></label>
            <input type="range" id="alavancagem" min="1" max="100" value="10">
        </div>
        
        <div class="results">
            <div class="result-item">Tamanho da Posição: <span id="res-tamanho">$0.00</span></div>
            <div class="result-item">Margem Exigida: <span id="res-margem">$0.00</span></div>
            
            <div class="result-item" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <span>Perda Financeira Fixa:</span>
                    <span id="res-perda" class="danger">-$0.00</span>
                </div>
                <div style="display: flex; justify-content: flex-end; width: 100%;">
                    <span id="res-perda-pct" class="danger" style="font-size: 15px; font-weight: 600;">-0.00%</span>
                </div>
            </div>
            
            <div class="result-item" style="border-top: 1px solid #444; padding-top: 12px; margin-top: 12px;">
                Preço de Liquidação: <span id="res-liq">$0.00</span>
            </div>
            
            <div id="alerta-liq">
                ⚠️ PERIGO: Liquidação antes do Stop! Reduza a alavancagem.
            </div>
        </div>
    </div>

    <script>
        // Função auxiliar para formatar números no padrão US (vírgula para milhares, ponto para decimais)
        function formatarNumero(valor, decimais = 2) {
            return valor.toLocaleString('en-US', {
                minimumFractionDigits: decimais,
                maximumFractionDigits: decimais
            });
        }

        // Função para limpar string formatada e converter para float de cálculo
        function parseValor(str) {
            if (!str) return 0;
            const limpo = str.toString().replace(/,/g, '');
            return parseFloat(limpo) || 0;
        }

        function toggleRisco() {
            const inputRisco = document.getElementById('risco');
            const valorAtual = parseValor(inputRisco.value);

            if(!isNaN(valorAtual)) {
                inputRisco.value = formatarNumero(valorAtual, 2);
            }
            calcular();
        }

        // Formata o input numérico ao perder o foco (blur)
        document.querySelectorAll('#capital, #risco, #entrada, #stop').forEach(input => {
            input.addEventListener('blur', function() {
                const val = parseValor(this.value);
                if (!isNaN(val)) {
                    const decimais = (this.id === 'entrada' || this.id === 'stop') && val < 1 ? 5 : 2;
                    this.value = formatarNumero(val, decimais);
                }
                calcular();
            });
        });

        async function buscarPreco() {
            let sigla = document.getElementById('cripto-busca').value.toUpperCase().trim();
            const status = document.getElementById('api-status');
            
            if(!sigla) return;
            
            if(!sigla.includes('USDT') && !sigla.includes('BUSD') && !sigla.includes('USDC')) {
                sigla += 'USDT';
            }

            status.innerText = "Buscando preço ao vivo...";
            status.style.color = "#aaa";

            try {
                const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sigla}`);
                if(!response.ok) throw new Error("Ativo não encontrado");
                
                const data = await response.json();
                const precoAtivo = parseFloat(data.price);
                
                const decimais = precoAtivo < 1 ? 5 : 2;
                document.getElementById('entrada').value = formatarNumero(precoAtivo, decimais);
                
                const tipo = document.querySelector('input[name="tipo"]:checked').value;
                const distStop = tipo === 'long' ? 0.98 : 1.02; 
                
                document.getElementById('stop').value = formatarNumero(precoAtivo * distStop, decimais);
                
                status.innerText = `Cotação de ${sigla} atualizada!`;
                status.style.color = "#4ade80";
                
                calcular();
                
            } catch (erro) {
                status.innerText = "Erro: Sigla inválida na Binance.";
                status.style.color = "#f87171";
            }
        }

        document.getElementById('cripto-busca').addEventListener('change', buscarPreco);
        document.getElementById('cripto-busca').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarPreco();
        });

        function calcular() {
            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            const cap = parseValor(document.getElementById('capital').value);
            const riscoInput = parseValor(document.getElementById('risco').value);
            const isDollar = document.getElementById('risco-tipo-checkbox').checked; 
            const entrada = parseValor(document.getElementById('entrada').value);
            const stop = parseValor(document.getElementById('stop').value);
            const lev = parseInt(document.getElementById('alavancagem').value);
            
            document.getElementById('lev-val').innerText = lev;
            
            if(!cap || isNaN(riscoInput) || !entrada || !stop) return;
            if(tipo === 'long' && entrada <= stop) return;
            if(tipo === 'short' && entrada >= stop) return;

            let riscoFinanceiro;
            let riscoPct;
            
            if (!isDollar) {
                riscoPct = riscoInput;
                riscoFinanceiro = cap * (riscoPct / 100);
            } else {
                riscoFinanceiro = riscoInput; 
                riscoPct = (cap > 0) ? (riscoFinanceiro / cap) * 100 : 0;
            }
            
            let distanciaStopPct;
            if(tipo === 'long') {
                distanciaStopPct = (entrada - stop) / entrada;
            } else {
                distanciaStopPct = (stop - entrada) / entrada;
            }
            
            const tamanhoPosicao = riscoFinanceiro / distanciaStopPct;
            const margem = tamanhoPosicao / lev;
            
            let precoLiq;
            if(tipo === 'long') {
                precoLiq = entrada * (1 - (1 / lev));
            } else {
                precoLiq = entrada * (1 + (1 / lev));
            }

            // Atualiza resultados formatados
            document.getElementById('res-tamanho').innerText = '$' + formatarNumero(tamanhoPosicao, 2);
            document.getElementById('res-margem').innerText = '$' + formatarNumero(margem, 2);
            
            document.getElementById('res-perda').innerText = '-$' + formatarNumero(riscoFinanceiro, 2);
            document.getElementById('res-perda-pct').innerText = '-' + formatarNumero(riscoPct, 2) + '%';
            
            const elLiq = document.getElementById('res-liq');
            const elAlerta = document.getElementById('alerta-liq');
            
            const liqDecimais = entrada < 1 ? 5 : 2;
            elLiq.innerText = '$' + formatarNumero(precoLiq, liqDecimais);
            
            let perigo = false;
            if(tipo === 'long' && precoLiq >= stop) perigo = true;
            if(tipo === 'short' && precoLiq <= stop) perigo = true;

            if(perigo) {
                elLiq.className = 'danger';
                elAlerta.style.display = 'block';
            } else {
                elLiq.className = 'warning';
                elAlerta.style.display = 'none';
            }
        }

        document.querySelectorAll('input[name="tipo"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const entrada = parseValor(document.getElementById('entrada').value);
                const decimais = entrada < 1 ? 5 : 2;
                if(e.target.value === 'long') {
                    document.getElementById('stop').value = formatarNumero(entrada * 0.98, decimais); 
                } else {
                    document.getElementById('stop').value = formatarNumero(entrada * 1.02, decimais); 
                }
                calcular();
            });
        });

        // Dispara o cálculo em tempo real enquanto digita
        document.querySelectorAll('#capital, #risco, #entrada, #stop').forEach(input => {
            input.addEventListener('input', calcular);
        });
        
        calcular();
    </script>
</body>
</html>
